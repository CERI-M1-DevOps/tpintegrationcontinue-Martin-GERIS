name: "Java CI with Maven - Test and package"

on:
  pull_request:
    branches:
      [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: "Afficher le dépôt courant1"
        run: |
          echo "Répertoire courant : $(pwd)"
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
      - name: Caching
        uses: actions/cache@v4
        with:
          path: ./src/cache
          key: custom-maven-${{ hashFiles('**/pom.xml') }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
         repository: '${{ github.repository }}'
      - name: "Installation Java"
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - name: Construction
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=$(echo ${{ github.repository }} | sed 's-/-_-') 
      - name: "Afficher le dépôt courant 2"
        run: |
          echo "Répertoire courant : $(pwd)"
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"