name: "Java CI with Maven - Test and package"

on:
  pull_request:
    branches:
      [ main ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: "Installation Java"
          uses: action/setup-Java@v4
          with:
            java-version: '21'
            distribution: 'corretto'
        - name: Construction
          run: mvn -B package

